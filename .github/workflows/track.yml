name: Price check

on:
  schedule:
    - cron: "17 * * * *"      # every hour; each product follows its own hour/day setting
  workflow_dispatch:           # "Run workflow" button
  push:
    paths: ["products.txt"]    # check new products right after you edit the list

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tracker.py check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COUNTRY: AU
          TZ: Australia/Sydney
      - name: Save price history
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in prices.db alerts.log products.txt history.csv; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Price check $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
